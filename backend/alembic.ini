[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
# timezone intentionally unset: resolving an IANA name needs the tzdata database,
# which is absent on stripped-down Windows Python installs and would break every
# alembic command for no real benefit (it only affects the timestamp in filenames).
# NOTE: keep this file ASCII-only. Python reads .ini with the platform default
# codec (GBK on Chinese Windows), so any non-ASCII comment breaks every alembic command.
# The database URL is resolved in alembic/env.py from app.config to avoid duplicated config.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
