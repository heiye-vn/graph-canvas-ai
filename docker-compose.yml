name: graph-canvas-ai
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:7411:5432"
    environment:
      POSTGRES_USER: retouch
      POSTGRES_PASSWORD: retouch_dev
      POSTGRES_DB: retouch
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retouch -d retouch"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:7412:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO 服务
  #   镜像用 pgsty/silo（Pigsty 社区维护的 MinIO 分支）：
  #     - minio/minio 已于 2026-09-11 从 Docker Hub 删除，quay.io 也于 2026-09-24 起要求鉴权
  #     - silo 保留 S3 API、MINIO_* 环境变量、/minio/* 路由与磁盘格式，可原地替换
  #     - 相比停更的社区版，silo 持续提供安全修复，且恢复了完整的 Web 控制台
  #   开发环境用 latest 以持续获得安全更新；生产部署请固定为已验证的
  #   tag 或 digest，例如 pgsty/silo:RELEASE.2026-09-16T00-00-00Z
  minio:
    image: pgsty/silo:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      # 仅绑定回环地址，避免弱口令在局域网裸奔
      - "127.0.0.1:7413:9000"
      - "127.0.0.1:7414:9001"
    environment:
      MINIO_ROOT_USER: retouch
      MINIO_ROOT_PASSWORD: retouch_dev
    volumes:
      - minio_data:/data
    healthcheck:
      # 用 silo 二进制内置的就绪探针，不依赖容器内是否存在 curl/wget。
      # 若改用 HTTP 探测，务必写 127.0.0.1 而非 localhost：
      # BusyBox 的 wget 会把 localhost 解析成 IPv6 [::1]，而服务仅监听 IPv4，探针会永久失败
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # 以下两个仅在部署时启用：docker compose --profile deploy up -d
  app:
    profiles: ["deploy"]
    build: .
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 7402
    ports:
      - "127.0.0.1:7402:7402"
    env_file: .env
    volumes:
      - cv_models:/root/.u2net
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker:
    profiles: ["deploy"]
    build: .
    restart: unless-stopped
    command: arq app.worker.WorkerSettings
    env_file: .env
    volumes:
      - cv_models:/root/.u2net
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

volumes:
  pg_data:
  redis_data:
  minio_data:
  cv_models:
